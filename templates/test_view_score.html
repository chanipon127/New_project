<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Score</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Sarabun", sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #4d89ff 0%, #07132f 35%),
                radial-gradient(circle at bottom right, #18c7e6 0%, transparent 30%),
                #07132f;

            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .page-title {
            text-align: center;
            color: white;
            font-size: 64px;
            margin-bottom: 30px;

            text-shadow:
                0 4px 20px rgba(0,0,0,.35);
        }

        .score-card {
            background: rgba(255,255,255,.95);
            border-radius: 25px;
            padding: 30px;

            text-align: center;

            box-shadow:
                0 15px 35px rgba(0,0,0,.25);

            margin-bottom: 30px;
        }

        .score-title {
            font-size: 28px;
            color: #666;
        }

        .score-value {
            font-size: 90px;
            font-weight: bold;
            color: #3478f6;
        }

        .score-level {
            font-size: 24px;
            color: #2f9e44;
            font-weight: bold;
        }

        .detail-card {
            background: rgba(255,255,255,.95);
            border-radius: 25px;
            padding: 30px;

            box-shadow:
                0 15px 35px rgba(0,0,0,.25);
        }

        .detail-card h2 {
            margin-bottom: 20px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #3478f6;
            color: white;
            padding: 15px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:hover {
            background: #f5f8ff;
        }

        .button-group {
            margin-top: 30px;
            text-align: center;
        }

        .btn {
            display: inline-block;

            padding: 14px 30px;
            margin: 0 10px;

            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;

            transition: .25s;
        }

        .btn-home {
            background: #3478f6;
        }

        .btn-download {
            background: #2f9e44;
        }

        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1 class="page-title">View Score</h1>

        <!-- คะแนนรวม -->
        <div class="score-card">
            <div class="score-title">คะแนนรวม</div>
            <div class="score-value">18 / 20</div>
            <div class="score-level">ดีมาก</div>
        </div>

        <!-- ตารางคะแนน -->
        <div class="detail-card">

            <h2>รายละเอียดการประเมิน</h2>

            <table>
                <thead>
                    <tr>
                        <th>เกณฑ์</th>
                        <th>คะแนน</th>
                        <th>เต็ม</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>ใจความสำคัญ</td>
                        <td>4</td>
                        <td>4</td>
                    </tr>

                    <tr>
                        <td>การเรียงลำดับความคิด</td>
                        <td>3</td>
                        <td>4</td>
                    </tr>

                    <tr>
                        <td>การเชื่อมโยงความคิด</td>
                        <td>4</td>
                        <td>4</td>
                    </tr>

                    <tr>
                        <td>การใช้ภาษา</td>
                        <td>3</td>
                        <td>4</td>
                    </tr>

                    <tr>
                        <td>การสะกดคำ</td>
                        <td>4</td>
                        <td>4</td>
                    </tr>
                </tbody>
            </table>

            <div class="button-group">
                <a href="home_page.html" class="btn btn-home">
                    กลับหน้าหลัก
                </a>

            </div>

        </div>

    </div>

</body>

</html>
