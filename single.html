<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single answer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: "THSarabunPali", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top left, #4d89ff 0%, #07132f 35%),
                radial-gradient(circle at bottom right, #18c7e6 0%, transparent 30%),
                #07132f;
            font-family: "Segoe UI", sans-serif;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 40px auto 0;
            padding: 40px 20px;
            text-align: center;
        }

        .page-title {
            font-size: 72px;
            font-weight: bold;
            color: white;

            margin-bottom: 40px;

            text-shadow:
                0 4px 20px rgba(0, 0, 0, .35);
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        textarea {
            font-family: "THSarabunPali", sans-serif !important;
            font-weight: normal !important;

            font-size: 22px !important;

            min-width: 640px !important;
            max-width: 640px !important;

            min-height: 225px !important;
            max-height: 225px !important;

            padding: 10px;
            padding-right: 10px;
            border: 1px solid #ccc;
            border-radius: 18px;
            resize: none;

            margin-top: 10px;

            background: rgba(255, 255, 255, .95);

            box-shadow:
                0 15px 35px rgba(0, 0, 0, .25);

            overflow-y: auto;
            
        }

        textarea::-webkit-scrollbar {
            width: 12px;
        }

        textarea::-webkit-scrollbar-track {
            margin: 6px 0;
        }

        textarea:focus {
            outline: none;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, .25),
                0 0 0 4px rgba(77, 137, 255, .4);
        }

        button {
            margin-top: 30px;

            width: 220px;
            height: 65px;

            border: none;
            border-radius: 15px;

            background: linear-gradient(135deg,
                    #5b9dff,
                    #3478f6);

            color: white;
            font-size: 30px;
            font-weight: bold;

            cursor: pointer;

            transition: .25s;
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(52, 120, 246, .45);
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 2.3rem;
            }

            textarea {
                font-size: 1.2rem;
                min-height: 250px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="page-title">Single answer</h1>
        <div class="textarea-wrapper">
            <textarea name="answer" id="answer" cols="30" rows="10" placeholder="Your answer here..."></textarea>
            <button type="submit">Submit</button>
        </div>
    </div>
</body>

</html>
